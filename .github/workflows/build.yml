name: Build SnapOrka

# SnapOrka: minimal CI for macOS arm64 + Linux. Windows + universal-macOS deferred until
# we have a hosted runner config / signing certs. Snapmaker-Orca's full 15-workflow setup is
# tied to that org's infra (Sentry CLI, flatpak deploy, release IDs) — we strip down to the
# essentials a fork can run without secret state.

on:
  push:
    branches: [main]
    paths:
      - 'SnapOrka/deps/**'
      - 'SnapOrka/src/**'
      - 'SnapOrka/**/CMakeLists.txt'
      - 'SnapOrka/version.inc'
      - 'SnapOrka/resources/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    timeout-minutes: 240
    defaults:
      run:
        working-directory: SnapOrka
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          brew install cmake automake autoconf libtool ninja

      - name: Cache deps
        uses: actions/cache@v4
        id: deps-cache
        with:
          path: |
            SnapOrka/deps/build/arm64/OrcaSlicer_dep
            SnapOrka/deps/DL_CACHE
          key: snaporka-deps-arm64-${{ hashFiles('SnapOrka/deps/**/*.cmake', 'SnapOrka/deps/**/CMakeLists.txt') }}

      - name: Build deps
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./build_release_macos.sh -d -a arm64

      - name: Build slicer
        run: ./build_release_macos.sh -s -a arm64

      - name: Package .app
        run: |
          cd build/arm64/SnapOrka
          if [ -d "SnapOrka.app" ]; then
            zip -ry "SnapOrka-macOS-arm64.zip" "SnapOrka.app"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapOrka-macOS-arm64
          path: SnapOrka/build/arm64/SnapOrka/SnapOrka-macOS-arm64.zip
          if-no-files-found: warn

  linux-x86_64:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        working-directory: SnapOrka
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install system deps
        run: ./build_linux.sh -u

      - name: Cache deps
        uses: actions/cache@v4
        id: deps-cache
        with:
          path: SnapOrka/deps/build_linux/destdir
          key: snaporka-deps-linux-${{ hashFiles('SnapOrka/deps/**/*.cmake', 'SnapOrka/deps/**/CMakeLists.txt') }}

      - name: Build deps + slicer + AppImage
        run: ./build_linux.sh -dsi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapOrka-Linux-x86_64
          path: SnapOrka/build/SnapOrka_Linux_*.AppImage
          if-no-files-found: warn
